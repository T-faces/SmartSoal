name: Deploy SmartSoal to GitHub Pages

on:
  push:
    branches: [Master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check frontend JavaScript syntax
        run: node --check app.js
      - name: Check Apps Script JavaScript syntax
        run: cp backend/Code.gs /tmp/Code.js && node --check /tmp/Code.js
      - name: Verify frontend files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          grep -q 'styles.css' index.html
          grep -q 'app.js' index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
